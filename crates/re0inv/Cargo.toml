[package]
name = "re0inv"
version = "0.1.0"
edition = "2021"
description = "Inventory expansion mod for Resident Evil 0 HD Remaster"
license = "MIT"
publish = false

[lib]
# cdylib: a plain native DLL, which is all Ultimate ASI Loader can LoadLibrary.
crate-type = ["cdylib"]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

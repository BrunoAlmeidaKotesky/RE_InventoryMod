[package]
name = "re0inv"
version = "0.1.0"
edition = "2021"
description = "Inventory expansion mod for Resident Evil 0 HD Remaster"
license = "MIT"
publish = false

[lib]
# cdylib: a plain native DLL, which is all Ultimate ASI Loader can LoadLibrary.
# rlib alongside it so the pure-logic modules can be unit tested.
crate-type = ["cdylib", "rlib"]

# Which of the bundled improvements are compiled in. The full build ships all
# three; each also builds alone, so a player can install exactly one. The
# distinction is compile-time: code for an absent feature is not in the DLL.
#
# "expanded" rather than "inventory" because the accessor and panel machinery
# is shared with the box; what this switch owns is the extra slots themselves.
[features]
default = ["expanded", "itembox", "doors"]
expanded = []
itembox = ["dep:msgtool"]
doors = []

# The one dependency is our own message-archive crate, and only when the box is
# built in: the mod writes the typewriter prompt's archives itself on first
# run, so installing is nothing but copying files. The Win32 surface the mod
# needs is nine functions, declared in src/win32.rs.
[dependencies]
msgtool = { path = "../msgtool", optional = true }

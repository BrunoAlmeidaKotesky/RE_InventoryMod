# Default every cargo invocation to the 32-bit target.
#
# Without this, `cargo check` and rust-analyzer evaluate the crate for the
# 64-bit host, where the 32-bit assertion in src/win32.rs fails and the editor
# fills with errors that the real build never sees.
[build]
target = "i686-pc-windows-gnu"

[target.i686-pc-windows-gnu]
# The mingw C runtime calls DllMain by its stdcall-decorated name, `DllMain@12`,
# while Rust exports it undecorated. The linker already bridges the two; this
# only stops it warning about doing so on every build.
rustflags = ["-C", "link-arg=-Wl,--enable-stdcall-fixup"]

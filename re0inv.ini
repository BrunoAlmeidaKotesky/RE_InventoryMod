[Enable]
; Master switch. 0 loads the mod but changes nothing.
Mod=1

; Inventory slots per character. Must be even (two-slot items break otherwise).
; 6 is stock. Maximum 32.
Slots=12

[Doors]
; Skip the animation played when walking through a door.
;
; The game does not end that sequence when its timer runs out; it ends when the
; room change reports finished. Shortening the timer removes padding on top of
; the load, and cannot show an unloaded room.
SkipDoors=0

; Also shorten the fades around the transition. Without this the wait is gone
; but the screen still fades out and back in around a glimpse of the door.
ShortenFades=1

[Log]
; off, error, warn, info, debug, trace
Level=info
; Relative paths are resolved against the game directory.
Path=re0inv.log

[Debug]
; Dump the code section once Steam DRM has decrypted it, for offline analysis.
; Produces a ~9 MB file. Leave off unless you are analysing the binary.
DumpText=0
DumpPath=re0hd_text_dump.bin

; Hotkey-driven memory probe. Output goes to the log.
;   F8  remove every patch this mod applied
;   F9  scan memory for ProbeValue
;   F10 narrow the previous hits to the current ProbeValue
;   F11 hexdump the surviving hits, also decoded as a Bag struct
;   F12 log the memory region map
; ProbeValue is re-read on every press, so edit it and save without restarting.
Probe=0
ProbeValue=0
